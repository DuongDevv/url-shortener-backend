version: '3.8'                                             
                                                              
   services:                                                  
     # 1. Backend Application Container                       
     app:                                                     
       build:                                                 
         context: .                                           
         dockerfile: Dockerfile                               
       container_name: url_shortener_app                      
       restart: always                                        
       ports:                                                 
         - "3000:3000"                                        
       environment:                                           
         PORT: 3000                                           
         NODE_ENV: production                                 
         DB_HOST: postgres                                    
         DB_PORT: 5432                                        
         DB_USER: postgres                                    
         DB_PASSWORD: rootsecret                              
         DB_NAME: url_shortener_db                            
       depends_on:                                            
         postgres:                                            
           condition: service_healthy                         
       networks:                                              
         - app-network                                        
                                                              
     # 2. Database PostgreSQL Container                       
     postgres:                                                
       image: postgres:16-alpine                              
       container_name: url_shortener_postgres                 
       restart: always                                        
       environment:                                           
         POSTGRES_USER: postgres                              
         POSTGRES_PASSWORD: rootsecret                        
         POSTGRES_DB: url_shortener_db                        
       volumes:                                               
         - postgres_data:/var/lib/postgresql/data             
       healthcheck:                                           
         test: ["CMD-SHELL", "pg_isready -U postgres"]        
         interval: 5s                                         
         timeout: 5s                                          
         retries: 5                                           
       networks:                                              
         - app-network                                        
                                                              
     # 3. Redis In-Memory Cache Container                     
     redis:                                                   
       image: redis:7-alpine                                  
       container_name: url_shortener_redis                    
       restart: always                                        
       ports:                                                 
         - "6379:6379"                                        
       networks:                                              
         - app-network                                        
                                                              
   networks:                                                  
     app-network:                                             
       driver: bridge                                         
                                                              
   volumes:                                                   
     postgres_data: 